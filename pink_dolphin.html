<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delfín Rosa Animado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .dolphin-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 200px;
            animation: swim 4s ease-in-out infinite;
            cursor: pointer;
        }

        .dolphin {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
        }

        .dolphin path {
            fill: #ff91a4;
            /* Delfín rosa */
            stroke: #ff6b81;
            stroke-width: 2;
        }

        .eye {
            fill: white;
        }

        .pupil {
            fill: black;
        }

        /* Animación de nado suave */
        @keyframes swim {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) translateY(0);
            }

            25% {
                transform: translate(-50%, -50%) rotate(-5deg) translateY(-20px);
            }

            50% {
                transform: translate(-50%, -50%) rotate(0deg) translateY(0);
            }

            75% {
                transform: translate(-50%, -50%) rotate(5deg) translateY(20px);
            }

            100% {
                transform: translate(-50%, -50%) rotate(0deg) translateY(0);
            }
        }

        /* Burbujas */
        .bubble {
            position: absolute;
            bottom: -20px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: rise 5s infinite ease-in;
            pointer-events: none;
        }

        @keyframes rise {
            0% {
                bottom: -20px;
                transform: translateX(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                bottom: 110%;
                transform: translateX(-50px);
                opacity: 0;
            }
        }

        .water-reflection {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
            pointer-events: none;
        }

        h1 {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 300;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="ocean" id="ocean">
        <h1>Delfín Rosa</h1>
        <div class="water-reflection"></div>

        <div class="dolphin-container" id="dolphin">
            <!-- SVG de un delfín simplificado -->
            <svg class="dolphin" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
                <g transform="scale(-1, 1) translate(-500, 0)">
                    <!-- Voltear horizontalmente para nadar a la izquierda -->
                    <path
                        d="M430,150 Q400,100 350,100 Q300,100 250,130 Q200,160 150,150 Q100,140 50,180 Q20,200 10,230 Q30,220 60,210 Q100,200 140,210 Q180,220 220,200 Q260,180 300,180 Q350,180 380,220 Q400,250 420,230 Q410,200 430,150 M250,130 Q260,80 230,50 Q250,70 270,120 M350,180 Q360,210 390,200" />
                    <!-- Cuerpo principal más refinado -->
                    <path
                        d="M380,160 C320,100 200,120 120,160 C80,180 40,190 10,220 C40,210 80,200 120,200 C180,200 240,220 300,200 C340,190 380,200 400,230 C410,210 420,190 380,160 Z"
                        fill="#ff91a4" />
                    <!-- Aleta dorsal -->
                    <path d="M240,135 C250,100 230,80 210,60 C230,90 260,120 270,140 Z" fill="#ff91a4" />
                    <!-- Aleta pectoral -->
                    <path d="M280,190 C290,220 320,230 340,220 C320,210 300,200 280,190 Z" fill="#ff8095" />
                    <!-- Cola -->
                    <path
                        d="M400,230 C430,250 450,220 460,200 C440,210 420,220 400,210 C420,190 440,170 450,150 C430,170 410,190 380,160"
                        fill="#ff91a4" />

                    <!-- Ojo -->
                    <circle cx="150" cy="170" r="5" class="eye" />
                    <circle cx="152" cy="170" r="2" class="pupil" />
                </g>
            </svg>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ocean = document.getElementById('ocean');
            const dolphin = document.getElementById('dolphin');

            // Función para crear burbujas
            function createBubble() {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');

                // Tamaño aleatorio
                const size = Math.random() * 20 + 10;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;

                // Posición horizontal aleatoria
                bubble.style.left = `${Math.random() * 100}%`;

                // Duración aleatoria de la animación
                bubble.style.animationDuration = `${Math.random() * 3 + 3}s`;

                ocean.appendChild(bubble);

                // Eliminar burbuja después de la animación
                setTimeout(() => {
                    bubble.remove();
                }, 6000);
            }

            // Crear burbujas periódicamente
            setInterval(createBubble, 300);

            // Interacción simple: el delfín sigue un poco al mouse
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 30;
                const y = (window.innerHeight / 2 - e.clientY) / 30;

                // Aplicamos una transformación suave sobre la animación existente
                // Nota: Esto es un poco truculento porque ya tenemos una animación CSS transformando.
                // Para hacerlo bien, podríamos aplicar esto a un contenedor padre o hijo, o usar variables CSS.
                // Usaremos variables CSS para no romper la animación @keyframes.
            });

            // Hacer que el delfín salte al hacer click
            dolphin.addEventListener('click', () => {
                dolphin.style.animation = 'none';
                // Forzar reflow
                void dolphin.offsetWidth;
                dolphin.style.animation = 'jump 1s ease-out';

                setTimeout(() => {
                    dolphin.style.animation = 'swim 4s ease-in-out infinite';
                }, 1000);
            });

            // Añadir animación de salto dinámicamente
            const styleSheet = document.createElement("style");
            styleSheet.innerText = `
                @keyframes jump {
                    0% { transform: translate(-50%, -50%) rotate(0deg); }
                    50% { transform: translate(-50%, -150%) rotate(-20deg); }
                    100% { transform: translate(-50%, -50%) rotate(0deg); }
                }
            `;
            document.head.appendChild(styleSheet);
        });
    </script>
</body>

</html>
