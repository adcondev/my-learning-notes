<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delfín Rosa Animado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .ocean {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .dolphin-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            max-width: 300px;
            height: auto;
            aspect-ratio: 3/2;
            animation: swim 4s ease-in-out infinite;
            cursor: pointer;
        }

        .dolphin {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
            mix-blend-mode: multiply;
        }

        /* Animación de nado suave */
        @keyframes swim {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) translateY(0);
            }

            25% {
                transform: translate(-50%, -50%) rotate(-5deg) translateY(-20px);
            }

            50% {
                transform: translate(-50%, -50%) rotate(0deg) translateY(0);
            }

            75% {
                transform: translate(-50%, -50%) rotate(5deg) translateY(20px);
            }

            100% {
                transform: translate(-50%, -50%) rotate(0deg) translateY(0);
            }
        }

        /* Burbujas */
        .bubble {
            position: absolute;
            bottom: -20px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: rise 5s infinite ease-in;
            pointer-events: none;
        }

        @keyframes rise {
            0% {
                bottom: -20px;
                transform: translateX(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                bottom: 110%;
                transform: translateX(-50px);
                opacity: 0;
            }
        }

        .water-reflection {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
            pointer-events: none;
        }

        h1 {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 300;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
                top: 10px;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ocean = document.getElementById('ocean');
            const dolphin = document.getElementById('dolphin');

            // Función para crear burbujas
            function createBubble() {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');

                // Tamaño aleatorio
                const size = Math.random() * 20 + 10;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;

                // Posición horizontal aleatoria
                bubble.style.left = `${Math.random() * 100}%`;

                // Duración aleatoria de la animación
                bubble.style.animationDuration = `${Math.random() * 3 + 3}s`;

                ocean.appendChild(bubble);

                // Eliminar burbuja después de la animación
                setTimeout(() => {
                    bubble.remove();
                }, 6000);
            }

            // Crear burbujas periódicamente
            setInterval(createBubble, 300);

            // Interacción simple: el delfín sigue un poco al mouse
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.clientX) / 30;
                const y = (window.innerHeight / 2 - e.clientY) / 30;

                // Aplicamos una transformación suave sobre la animación existente
                // Nota: Esto es un poco truculento porque ya tenemos una animación CSS transformando.
                // Para hacerlo bien, podríamos aplicar esto a un contenedor padre o hijo, o usar variables CSS.
                // Usaremos variables CSS para no romper la animación @keyframes.
            });

            // Hacer que el delfín salte al hacer click
            dolphin.addEventListener('click', () => {
                dolphin.style.animation = 'none';
                // Forzar reflow
                void dolphin.offsetWidth;
                dolphin.style.animation = 'jump 1s ease-out';

                setTimeout(() => {
                    dolphin.style.animation = 'swim 4s ease-in-out infinite';
                }, 1000);
            });

            // Añadir animación de salto dinámicamente
            const styleSheet = document.createElement("style");
            styleSheet.innerText = `
                @keyframes jump {
                    0% { transform: translate(-50%, -50%) rotate(0deg); }
                    50% { transform: translate(-50%, -150%) rotate(-20deg); }
                    100% { transform: translate(-50%, -50%) rotate(0deg); }
                }
            `;
            document.head.appendChild(styleSheet);
        });
    </script>
